<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8b6f47">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Klinik Pro">
  <meta name="description" content="Klinik hasta takip ve karar destek sistemi">

  <title>Klinik Pro</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="header" style="display:none">
    <div class="header-left">
      <span class="header-logo">🏥</span>
      <span class="header-title">Klinik Pro</span>
    </div>
    <div class="header-right">
      <span class="header-date" id="headerDate"></span>
      <span class="sync-indicator" id="syncIndicator"></span>
    </div>
  </header>

  <main id="app">
    <div class="loading">Yükleniyor…</div>
  </main>

  <nav class="bottom-nav" style="display:none">
    <!-- Nav items injected by app.js -->
  </nav>

  <button class="fab" id="fabBtn" style="display:none" aria-label="Yeni hasta ekle">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
